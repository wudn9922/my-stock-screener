name: zz temporary probe
on:
  push:
    branches: [claude/nice-cray-fs4a9b]
    paths: ['.github/workflows/zz-probe.yml', 'atlas/scripts/build_valuation_us.py']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run US valuation like the daily Atlas run (no commit)
        working-directory: atlas
        run: |
          mkdir -p public/symbols public/valuation
          cp ../docs/atlas/symbols/directory.json public/symbols/
          cp ../docs/atlas/valuation/us.json public/valuation/
          pip install --quiet 'curl_cffi>=0.7,<1'
          time python scripts/build_valuation_us.py
          python - <<'PY'
          import json
          it = json.load(open('public/valuation/us.json'))['items']
          adr = {k: v for k, v in it.items() if v.get('method')}
          print(len(it), 'records,', len(adr), 'ADR records')
          for s in ['TSM','NVO','ASML','TM','BABA','SONY','HSBC','SAP','AZN','PDD','JD','TCOM','INFY','HDB','MUFG','NTES','AAPL']:
              print(s, it.get(s))
          pe = sorted((v['epsTtm'], k) for k, v in adr.items())
          print('lowest eps', pe[:5]); print('highest eps', pe[-5:])
          PY
