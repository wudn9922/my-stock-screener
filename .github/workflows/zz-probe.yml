name: zz temporary probe
on:
  push:
    branches: [claude/nice-cray-fs4a9b]
    paths: ['.github/probe/**', '.github/workflows/zz-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - run: pip install -q yfinance
      - run: python .github/probe/yahoo.py
