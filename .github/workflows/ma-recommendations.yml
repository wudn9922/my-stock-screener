name: MA Recommendations

# 建議均線（ma-selector 的 production 選擇：SMA、規則 B＋短期 rescue；規則在 ma-selector repo，這裡不改）
# → docs/report/ma-selector/<ticker>.json＋index.json，Atlas 圖表的「建議均線」卡片讀這裡。
# 股票清單＝台美股全市場（docs/report/universe.json 的 full 名單，約 7,200 檔）＋data/*.csv（略過 ^ 指數）；每檔重抓 Yahoo 5 年日K。
# 分批：每月只重算三分之一（ma-selector 的 --shard K/3，K＝(月份−1) % 3，分批＝crc32(代號) % 3），每檔每 3 個月更新一次；
# 還沒有檔案的股票（新股、第一次納入）每次另外最多補 MAX_MISSING 檔。其餘沿用現有檔案。名單不完整時不刪除清單外的舊檔。
# 每月 2 日台灣時間約 15:17（UTC 07:17）跑一次（排在 ma-selector 每月 1 日重建基準分佈之後）；抓不到的股票沿用上一次的檔案，成功率 < 50% 時不寫檔。
# GENERATED_BRANCH_MODE=1 時從 generated 分支還原舊檔、只發布 owner `ma`（.github/generated-paths.json）；否則照舊提交到 main。
# 手動填入 limit 時只試跑：強制不刪舊檔，輸出至 .cache/ma-trial，不發布或提交。
on:
  schedule:
    - cron: '17 7 2 * *'
  workflow_dispatch:
    inputs:
      ma_selector_ref:
        description: 'ma-selector 的分支／commit（預設 main）'
        required: false
        default: 'main'
      limit:
        description: '只跑前 N 檔（試跑，不發布；空白＝全部）'
        required: false
        default: ''
      shard:
        description: '分批：auto（依月份輪流）、0／1／2，或 all（全部重算，約 7,200 檔、時間長）'
        required: false
        default: 'auto'
      max_missing:
        description: '每次另外補算的「還沒有檔案」股票上限（-1＝全部）'
        required: false
        default: '1500'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GENERATED_BRANCH_MODE: ${{ vars.GENERATED_BRANCH_MODE }}
  MA_TRIAL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.limit != '' }}

permissions:
  contents: write

concurrency:
  group: ma-recommendations
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Restore generated inputs
        id: generated_restore
        if: env.MA_TRIAL != 'true' && vars.GENERATED_BRANCH_MODE == '1'
        run: python scripts/generated_branch.py restore

      - name: Restore trial ticker input
        if: env.MA_TRIAL == 'true' && vars.GENERATED_BRANCH_MODE == '1'
        run: |
          mkdir -p .cache
          git fetch --no-tags --depth=1 origin generated
          git show FETCH_HEAD:docs/report/universe.json > .cache/ma-universe.json

      - name: Checkout ma-selector
        uses: actions/checkout@v4
        with:
          repository: wudn9922/ma-selector
          ref: ${{ github.event.inputs.ma_selector_ref || 'main' }}
          path: _ma-selector

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet pandas numpy pyarrow

      - name: Ticker list (full market + data/*.csv)
        id: tickers
        env:
          UNIVERSE_FILE: ${{ env.MA_TRIAL == 'true' && vars.GENERATED_BRANCH_MODE == '1' && '.cache/ma-universe.json' || 'docs/report/universe.json' }}
        run: |
          python - <<'EOF'
          import json, os
          from pathlib import Path
          names = {p.stem for p in Path('data').glob('*.csv') if not p.stem.startswith('^')}
          complete = True
          try:
              doc = json.loads(Path(os.environ['UNIVERSE_FILE']).read_text(encoding='utf-8'))
          except Exception as exc:
              doc = {}; print(f'::warning::universe.json 無法讀取（{type(exc).__name__}）：只用 data/*.csv，且不刪除清單外的舊檔')
          fields = doc.get('fields') or []
          for market in ('TW', 'US'):
              source = (doc.get('markets') or {}).get(market) or {}
              if source.get('scope') != 'full' or 'symbol' not in fields:
                  complete = False; print(f'::warning::{market} 沒有 full 全市場名單：該市場只用 data/*.csv，且不刪除清單外的舊檔'); continue
              column = fields.index('symbol')
              rows = [row[column] for row in source.get('rows') or [] if isinstance(row, list) and len(row) > column and isinstance(row[column], str)]
              names.update(rows); print(f'{market} 全市場 {len(rows)} 檔（asOf {source.get("asOf")}）')
          Path('.cache').mkdir(exist_ok=True)
          Path('.cache/ma-tickers.txt').write_text('\n'.join(sorted(names)) + '\n', encoding='utf-8')
          print(f'股票清單共 {len(names)} 檔')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"prune={'1' if complete else '0'}\n")
          EOF
      - name: Build recommendations
        env:
          LIMIT: ${{ github.event.inputs.limit }}
          SHARD_INPUT: ${{ github.event.inputs.shard || 'auto' }}
          MAX_MISSING: ${{ github.event.inputs.max_missing || '1500' }}
          PRUNE: ${{ steps.tickers.outputs.prune }}
        run: |
          export OUTPUT_DIR=docs/report/ma-selector
          if [ "$MA_TRIAL" = true ]; then
            OUTPUT_DIR=.cache/ma-trial
            PRUNE=0
            echo '### 建議均線：試跑，未發布' >> "$GITHUB_STEP_SUMMARY"
          fi
          args=(--out "$OUTPUT_DIR" --workers 4)
          if [ "$MA_TRIAL" = true ]; then
            args+=(--no-prune)
          fi
          if [ -n "$LIMIT" ]; then
            args+=(--limit "$LIMIT")
          fi
          case "$SHARD_INPUT" in
            auto) SHARD="$(( (10#$(date -u +%m) - 1) % 3 ))/3" ;;
            all) SHARD="all" ;;
            0|1|2) SHARD="$SHARD_INPUT/3" ;;
            *) echo "::error::shard 必須是 auto、0、1、2 或 all（收到 $SHARD_INPUT）"; exit 1 ;;
          esac
          if grep -q -- '--shard' _ma-selector/scripts/build_recommendations.py; then
            echo "分批 $SHARD；缺檔上限 $MAX_MISSING；刪除清單外舊檔：$([ "$PRUNE" = 1 ] && echo 是 || echo 否)"
            args+=(--tickers-file .cache/ma-tickers.txt --shard "$SHARD" --max-missing "$MAX_MISSING")
            if [ "$MA_TRIAL" != true ] && [ "$PRUNE" != 1 ]; then
              args+=(--no-prune)
            fi
          else
            echo "::warning::ma-selector 尚未支援分批：照舊只跑 data/*.csv"
            args+=(--from-dir data)
          fi
          python -u _ma-selector/scripts/build_recommendations.py "${args[@]}"
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          d = json.loads((Path(os.environ['OUTPUT_DIR']) / 'index.json').read_text(encoding='utf-8'))
          print(f"### 建議均線\n要求 {d['requested']} 檔、更新 {d['updated']} 檔、可用 {len(d['symbols'])} 檔、失敗 {len(d['failed'])} 檔（基準 {d['referenceAsof']}）")
          if d.get('refresh'): print(f"\n分批：{d['refresh']}（這次重算 {d.get('processed')} 檔）")
          for f in d['failed'][:30]: print(f"- {f['ticker']}：{f['reason']}")
          EOF

      - name: Remove ma-selector checkout
        if: always()
        run: rm -rf _ma-selector

      - name: Publish owned outputs to generated
        if: env.MA_TRIAL != 'true' && vars.GENERATED_BRANCH_MODE == '1' && steps.generated_restore.outcome == 'success'
        run: python scripts/generated_branch.py publish ma

      - name: Commit and Push changes
        if: env.MA_TRIAL != 'true' && vars.GENERATED_BRANCH_MODE != '1'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add -A docs/report/ma-selector
          git commit -q -m "Auto-update MA recommendations" || { echo "No changes to commit"; exit 0; }
          # 每日報告與其他 workflow 也會推送到 main，失敗時重新 rebase 後重試
          for attempt in 1 2 3; do
            git pull --rebase
            if git push; then
              exit 0
            fi
            echo "推送失敗（第 ${attempt} 次），稍後重試"
            sleep $((attempt * 15))
          done
          exit 1
  notify-system-failure:
    needs: ["build"]
    if: ${{ always() && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (failure() || cancelled()) }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/notify-failure.yml
    with:
      title: "${{ github.workflow }} · ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && '執行失敗／取消' || '部分失敗' }}"
      needs-json: ${{ toJSON(needs) }}
    secrets:
      DISCORD_WEBHOOK_URL1: ${{ secrets.DISCORD_WEBHOOK_URL1 }}
      LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
      LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
