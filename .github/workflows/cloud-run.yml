name: Deploy Cloud Run (breakout alert)

# 突破監控（Dockerfile.breakout）與 Discord 查詢（Dockerfile.discord-query）合併到 main 後自動建置並部署。
# 更新服務映像及帳號儲存政策的管理員 ID；其他既有環境變數、secret、排程不變。
# 用 Workload Identity Federation 登入 Google Cloud（不需要金鑰檔），一次性設定見 scripts/setup-cloud-run-deploy.sh。
# 需要的 repository variables（Settings → Secrets and variables → Actions → Variables）：
#   GCP_WIF_PROVIDER、GCP_DEPLOY_SA、GCP_PROJECT_ID、GCP_REGION
#   CLOUD_RUN_BREAKOUT_SERVICE、CLOUD_RUN_BREAKOUT_IMAGE（不含 tag 的映像路徑）
#   CLOUD_RUN_DISCORD_SERVICE、CLOUD_RUN_DISCORD_IMAGE（選用，沒設就不部署 Discord 查詢服務）
# 未設定時會略過，不會失敗。
on:
  push:
    branches: [main]
    paths:
      - 'breakout_alert/**'
      - 'Dockerfile.breakout'
      - 'Dockerfile.discord-query'
      - 'requirements.txt'
      - 'requirements.discord-query.txt'
      - '.github/workflows/cloud-run.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-run-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 突破監控
            dockerfile: Dockerfile.breakout
            service_var: CLOUD_RUN_BREAKOUT_SERVICE
            image_var: CLOUD_RUN_BREAKOUT_IMAGE
          - name: Discord 查詢
            dockerfile: Dockerfile.discord-query
            service_var: CLOUD_RUN_DISCORD_SERVICE
            image_var: CLOUD_RUN_DISCORD_IMAGE
    env:
      WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: ${{ vars[matrix.service_var] }}
      IMAGE: ${{ vars[matrix.image_var] }}
      ADMIN_LINE_USER_ID: ${{ vars.ADMIN_LINE_USER_ID || 'Ua0037dbd5037b64fc76804c60520ad76' }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if ! [[ "${ADMIN_LINE_USER_ID}" =~ ^U[0-9a-f]{32}$ ]]; then
            echo "::error::ADMIN_LINE_USER_ID 格式不正確，停止部署避免帳號政策不一致。"
            exit 1
          fi
          missing=""
          for name in WIF_PROVIDER DEPLOY_SA PROJECT_ID REGION SERVICE IMAGE; do
            [ -n "${!name}" ] || missing="${missing} ${name}"
          done
          if [ -n "${missing}" ]; then
            echo "::notice::${{ matrix.name }}：缺少設定（${missing# }），略過部署。設定方式見 scripts/setup-cloud-run-deploy.sh"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        if: steps.config.outputs.ready == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - name: Set up gcloud
        if: steps.config.outputs.ready == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        if: steps.config.outputs.ready == 'true'
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${IMAGE%%/*}" --quiet
          docker build --file "${{ matrix.dockerfile }}" \
            --tag "${IMAGE}:${GITHUB_SHA}" --tag "${IMAGE}:latest" .
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

      - name: Deploy to Cloud Run
        if: steps.config.outputs.ready == 'true'
        run: |
          set -euo pipefail
          gcloud run deploy "${SERVICE}" \
            --image "${IMAGE}:${GITHUB_SHA}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --update-env-vars "ADMIN_LINE_USER_ID=${ADMIN_LINE_USER_ID}" \
            --quiet
          url=$(gcloud run services describe "${SERVICE}" --project "${PROJECT_ID}" --region "${REGION}" --format='value(status.url)')
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "${url}/health" || true)
          echo "${{ matrix.name }} 已部署：${url}（/health → HTTP ${code}）"
          if [ "${code}" != "200" ]; then
            echo "::warning::${{ matrix.name }} 的 /health 回應 HTTP ${code}（服務若需要驗證才能呼叫，403 屬正常）"
          fi

  notify-system-failure:
    needs: ["deploy"]
    if: ${{ always() && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (failure() || cancelled()) }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/notify-failure.yml
    with:
      title: "${{ github.workflow }} · ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && '執行失敗／取消' || '部分失敗' }}"
      needs-json: ${{ toJSON(needs) }}
    secrets:
      DISCORD_WEBHOOK_URL1: ${{ secrets.DISCORD_WEBHOOK_URL1 }}
      LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
      LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
