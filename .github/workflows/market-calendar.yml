name: Market trading calendar
on:
  schedule:
    # Taipei 08:20. This display-only producer must not affect the daily report watchdog.
    - cron: '20 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
env:
  GENERATED_BRANCH_MODE: ${{ vars.GENERATED_BRANCH_MODE }}
concurrency:
  group: market-calendar-generated
  cancel-in-progress: false
jobs:
  calendar:
    if: vars.GENERATED_BRANCH_MODE == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'exchange-calendars==4.13.2'
      - name: Restore generated publication baseline
        run: python scripts/generated_branch.py restore
      - name: Build future TW and US sessions without touching market records
        run: python scripts/build_market_calendar.py
      - name: Publish only the calendar owner
        run: python scripts/generated_branch.py publish calendar
  notify-system-failure:
    needs: ["calendar"]
    if: ${{ always() && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (failure() || cancelled()) }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/notify-failure.yml
    with:
      title: "${{ github.workflow }} · ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && '執行失敗／取消' || '部分失敗' }}"
      needs-json: ${{ toJSON(needs) }}
    secrets:
      DISCORD_WEBHOOK_URL1: ${{ secrets.DISCORD_WEBHOOK_URL1 }}
      LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
      LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
