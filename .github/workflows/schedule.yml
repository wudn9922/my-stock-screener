name: Daily Stock Screener

on:
  schedule:
    # 這裡使用的是國際標準時間 (UTC)。
    # UTC 03:05 = 台灣時間 11:05 晚4小時
    # 1-5 代表週一到週五執行（週末不執行）
    - cron: '5 3 * * 0-5' 
  workflow_dispatch: # 保留這個，讓你可以隨時手動點擊按鈕執行
  
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install requests

      - name: Inject Secrets into HTML
        run: |
          sed -i 's/SUPABASE_URL_PLACEHOLDER/${{ secrets.SUPABASE_URL }}/g' index.html
          sed -i 's/SUPABASE_ANON_KEY_PLACEHOLDER/${{ secrets.SUPABASE_ANON_KEY }}/g' index.html
          sed -i 's/ADMIN_LINE_ID_PLACEHOLDER/${{ secrets.ADMIN_LINE_ID }}/g' index.html
        
      - name: Run Screener
        env:
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python main.py

      # 🔥 2. 新增的 Dify 晨報程式
      - name: Run Dify Wall Street Report
        env:
          DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python dify_report.py

      # 🔥 3. 完美縮排的存檔上傳步驟
      - name: Commit and Push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Auto-update daily data and inject secrets" || echo "No changes to commit"
          git push
