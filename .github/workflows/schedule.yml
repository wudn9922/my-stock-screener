name: Daily Stock Screener

on:
  # 備援排程：GitHub 的 cron 不保證準時（實測常延遲 5～8 小時）。
  # 準時執行請用外部排程在台灣時間 17:00 呼叫 workflow_dispatch，
  # 兩者同一天只會有一個真的執行（見下方 guard）。
  schedule:
    - cron: '47 8 * * 0-5'
  workflow_dispatch:
    inputs:
      force:
        description: '即使今天已經跑過也強制執行'
        type: boolean
        default: false

env:
  GENERATED_BRANCH_MODE: ${{ vars.GENERATED_BRANCH_MODE }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  actions: read

# 避免排程與手動觸發同時執行而互相覆蓋
concurrency:
  group: daily-stock-screener
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Skip if today's report already ran
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 以「最近 16 小時」為界，而不是台灣時間的日期：
          # 備援 cron 常被 GitHub 延遲數小時，若剛好跨過午夜，日期界線會讓它在凌晨又完整重跑一次。
          # 16 小時小於兩個交易日之間的間隔（約 24 小時），所以隔天的正常執行不受影響。
          # 被略過的執行（幾秒就結束）不算數，否則略過的紀錄會把窗口一路往後推。
          SINCE=$(date -u -d "16 hours ago" +%Y-%m-%dT%H:%M:%SZ)
          OTHERS=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/schedule.yml/runs" \
            -f created=">=${SINCE}" -f per_page=50 \
            --jq "[.workflow_runs[]
                   | select(.id != ${GITHUB_RUN_ID})
                   | select(.status != \"completed\"
                            or (.conclusion == \"success\"
                                and ((.updated_at | fromdateiso8601) - (.run_started_at | fromdateiso8601)) > 120))]
                  | length")
          echo "最近 16 小時內其他執行次數：${OTHERS}"
          if [ "${OTHERS:-0}" -gt 0 ]; then
            echo "最近 16 小時內已經有執行過或正在執行，略過這次。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.GENERATED_BRANCH_MODE == '1' && 'main' || github.ref }}

      - name: Restore generated inputs
        id: generated_restore
        if: steps.guard.outputs.skip != 'true' && vars.GENERATED_BRANCH_MODE == '1'
        run: python scripts/generated_branch.py restore

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: |
          pip install -r requirements.txt
          pip install requests playwright
          playwright install firefox

      - name: Check Python Syntax
        if: steps.guard.outputs.skip != 'true'
        run: python -m py_compile main.py dify_report.py

      
      # 這裡把 Supabase 金鑰直接餵給 Python
      - name: Run Screener
        if: steps.guard.outputs.skip != 'true'
        env:
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # 讀取設定表用 service role（鎖定匿名讀取後 anon key 讀不到）；未設定時退回 anon key
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CUSTOM_GROUP_TEST_MODE: "false"
        run: python main.py

      # 市場寬度（F5）：只讀 data/ 的日 K，失敗不影響報告與其他步驟
      - name: Build market breadth
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        timeout-minutes: 15
        run: python scripts/build_breadth.py

      # 進場成功率由 universe-full.yml 使用完整市場名單與日線快取產生，避免本流程的部分名單覆蓋全市場報表。

      # ✨ 已修改：注入 Imgur 金鑰，讓自動截圖流能順利上傳並傳入 LINE
      - name: Run Dify Wall Street Report
        if: steps.guard.outputs.skip != 'true'
        env:
          DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FED_TARGET_LOWER_FALLBACK: ${{ vars.FED_TARGET_LOWER_FALLBACK }}
          FED_TARGET_UPPER_FALLBACK: ${{ vars.FED_TARGET_UPPER_FALLBACK }}
        run: python dify_report.py

      # 題材輪動（類股輪動）：下載成分股日線，美股產生 docs/report/themes.json、台股產生 docs/report/themes-tw.json。
      # 兩個市場依序各跑一次、各自失敗各自保留上次的檔案（互不拖累），最後有任一失敗才讓此步驟標為失敗；
      # 不影響主流程。
      - name: Build theme rotation
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        timeout-minutes: 15
        run: python scripts/build_themes.py --market us

      # 台股題材輪動改由 themes-tw.yml 在本流程成功後另開 runner 執行（獨立失敗、可單獨手動重跑）。

      # 美債與利率研究：FRED 殖利率與聯準會目標區間（有 FRED_API_KEY 時 API 優先，免金鑰 CSV 備援），
      # 產生 docs/report/rates.json 與 rates-history.json。失敗只保留上次的檔案，不影響主流程。
      - name: Build US rates research
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        timeout-minutes: 15
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -u scripts/build_rates.py

      # 財報分析中心改由 financials.yml 在本流程成功後另開 runner 執行：
      # 上千次 Yahoo 請求放在這裡會被前面的題材／利率步驟拖累而遭限流（HTTP 429）。

      - name: Publish owned outputs to generated and durable records to main
        if: (steps.guard.outputs.skip != 'true') && vars.GENERATED_BRANCH_MODE == '1' && steps.generated_restore.outcome == 'success'
        run: python scripts/generated_branch.py publish daily

      - name: Commit and Push changes
        if: (steps.guard.outputs.skip != 'true') && vars.GENERATED_BRANCH_MODE != '1'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          # data/*.csv 是永久 K 線紀錄，不再清除過期檔；開關關閉時仍與報告一起留 main。
          git add -A docs/report data
          git commit -m "Auto-update daily data and report JSON" || echo "No changes to commit"
          # Atlas workflow 也會推送到 main，失敗時重新 rebase 後重試
          for attempt in 1 2 3; do
            git pull --rebase
            if git push; then
              exit 0
            fi
            echo "推送失敗（第 ${attempt} 次），稍後重試"
            sleep $((attempt * 15))
          done
          exit 1

      # 不依賴 Claude 的故障通知：本 job 失敗或逾時（取消）時推播 LINE
      - name: Notify LINE on failure
        if: failure() || cancelled()
        env:
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          TITLE: "每日選股報告"
          RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${LINE_ACCESS_TOKEN}" ] || [ -z "${LINE_USER_ID}" ]; then
            echo "::warning::未設定 LINE_ACCESS_TOKEN / LINE_USER_ID，無法推播故障通知"
            exit 0
          fi
          text=$(printf '⚠️ %s %s\n台灣時間 %s\n%s' "${TITLE}" \
            "$([ "${RESULT}" = cancelled ] && echo '逾時或被取消' || echo '執行失敗')" \
            "$(TZ=Asia/Taipei date '+%m/%d %H:%M')" "${RUN_URL}")
          jq -n --arg to "${LINE_USER_ID}" --arg text "${text}" \
            '{to: $to, messages: [{type: "text", text: $text}]}' |
            curl -sS --fail-with-body --max-time 30 -X POST https://api.line.me/v2/bot/message/push \
              -H "Authorization: Bearer ${LINE_ACCESS_TOKEN}" -H 'Content-Type: application/json' -d @- ||
            echo "::warning::LINE 故障通知推播失敗"
