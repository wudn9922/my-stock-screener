name: Daily Stock Screener

on:
  # 備援排程：GitHub 的 cron 不保證準時（實測常延遲 5～8 小時）。
  # 準時執行請用外部排程在台灣時間 17:00 呼叫 workflow_dispatch，
  # 兩者同一天只會有一個真的執行（見下方 guard）。
  schedule:
    - cron: '47 8 * * 0-5'
  workflow_dispatch:
    inputs:
      force:
        description: '即使今天已經跑過也強制執行'
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  actions: read

# 避免排程與手動觸發同時執行而互相覆蓋
concurrency:
  group: daily-stock-screener
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Skip if today's report already ran
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 以台灣時間的「今天」00:00 為界
          TODAY=$(TZ=Asia/Taipei date +%F)
          SINCE=$(date -u -d "${TODAY} 00:00:00 +0800" +%Y-%m-%dT%H:%M:%SZ)
          OTHERS=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/schedule.yml/runs" \
            -f created=">=${SINCE}" -f per_page=50 \
            --jq "[.workflow_runs[]
                   | select(.id != ${GITHUB_RUN_ID})
                   | select(.status != \"completed\" or .conclusion == \"success\")]
                  | length")
          echo "今天（台灣時間 ${TODAY}）其他執行次數：${OTHERS}"
          if [ "${OTHERS:-0}" -gt 0 ]; then
            echo "今天已經有執行過或正在執行，略過這次。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4
        
      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: |
          pip install -r requirements.txt
          pip install requests playwright
          playwright install firefox

      - name: Check Python Syntax
        if: steps.guard.outputs.skip != 'true'
        run: python -m py_compile main.py

      
      # 這裡把 Supabase 金鑰直接餵給 Python
      - name: Run Screener
        if: steps.guard.outputs.skip != 'true'
        env:
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CUSTOM_GROUP_TEST_MODE: "false"
          # 舊版 24 MB docs/index.html 報告；改成 "true" 才會重新產生
          LEGACY_HTML_REPORT: "false"
        run: python main.py

      # ✨ 已修改：注入 Imgur 金鑰，讓自動截圖流能順利上傳並傳入 LINE
      - name: Run Dify Wall Street Report
        if: steps.guard.outputs.skip != 'true'
        env:
          DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FED_TARGET_LOWER_FALLBACK: ${{ vars.FED_TARGET_LOWER_FALLBACK }}
          FED_TARGET_UPPER_FALLBACK: ${{ vars.FED_TARGET_UPPER_FALLBACK }}
        run: python dify_report.py

      - name: Commit and Push changes
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          # -A 才會把「已被清理的過期 CSV」的刪除動作一起提交
          # docs/report：Atlas 報告 JSON；docs/index.html 只有 LEGACY_HTML_REPORT=1 時才會變動
          git add -A docs/report data docs/index.html
          git commit -m "Auto-update daily data and report JSON" || echo "No changes to commit"
          # Atlas workflow 也會推送到 main，失敗時重新 rebase 後重試
          for attempt in 1 2 3; do
            git pull --rebase
            if git push; then
              exit 0
            fi
            echo "推送失敗（第 ${attempt} 次），稍後重試"
            sleep $((attempt * 15))
          done
          exit 1

      # 不依賴 Claude 的故障通知：本 job 失敗或逾時（取消）時推播 LINE
      - name: Notify LINE on failure
        if: failure() || cancelled()
        env:
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          TITLE: "每日選股報告"
          RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${LINE_ACCESS_TOKEN}" ] || [ -z "${LINE_USER_ID}" ]; then
            echo "::warning::未設定 LINE_ACCESS_TOKEN / LINE_USER_ID，無法推播故障通知"
            exit 0
          fi
          text=$(printf '⚠️ %s %s\n台灣時間 %s\n%s' "${TITLE}" \
            "$([ "${RESULT}" = cancelled ] && echo '逾時或被取消' || echo '執行失敗')" \
            "$(TZ=Asia/Taipei date '+%m/%d %H:%M')" "${RUN_URL}")
          jq -n --arg to "${LINE_USER_ID}" --arg text "${text}" \
            '{to: $to, messages: [{type: "text", text: $text}]}' |
            curl -sS --fail-with-body --max-time 30 -X POST https://api.line.me/v2/bot/message/push \
              -H "Authorization: Bearer ${LINE_ACCESS_TOKEN}" -H 'Content-Type: application/json' -d @- ||
            echo "::warning::LINE 故障通知推播失敗"
