name: IPO and extended quotes
on:
  schedule:
    # Delayed public snapshots: US premarket, after close, and completed after-hours (DST aware in source).
    - cron: '41 12,13,21,22,1 * * 1-6'
  workflow_dispatch:
env:
  GENERATED_BRANCH_MODE: ${{ vars.GENERATED_BRANCH_MODE }}
permissions:
  contents: read
concurrency:
  group: market-extras
  cancel-in-progress: false
jobs:
  refresh:
    if: vars.GENERATED_BRANCH_MODE == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests 'exchange-calendars==4.13.2'
      - name: Check US session date before public source requests
        id: session
        run: python scripts/build_market_calendar.py --is-session US --github-output "$GITHUB_OUTPUT"
      - name: Restore generated display snapshots
        if: steps.session.outputs.is_session == 'true'
        run: python scripts/generated_branch.py restore
      - name: Refresh public IPO and extended quote snapshots
        if: steps.session.outputs.is_session == 'true'
        run: python scripts/build_market_extras.py
      - name: Publish only new display snapshots
        if: steps.session.outputs.is_session == 'true'
        run: python scripts/generated_branch.py publish marketExtras
  notify-system-failure:
    needs: ["refresh"]
    if: ${{ always() && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (failure() || cancelled()) }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/notify-failure.yml
    with:
      title: "${{ github.workflow }} · ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && '執行失敗／取消' || '部分失敗' }}"
      needs-json: ${{ toJSON(needs) }}
    secrets:
      DISCORD_WEBHOOK_URL1: ${{ secrets.DISCORD_WEBHOOK_URL1 }}
      LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
      LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
