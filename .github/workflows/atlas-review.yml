name: Atlas PR verification
on:
  pull_request:
    branches: [main]
    paths:
      - 'atlas/**'
      - 'breakout_alert/**'
      - 'supabase/functions/user-settings/**'
      - 'tests/test_atlas_watchlists.py'
      - 'tests/test_breakouts.py'
      - 'scripts/build_breakouts.py'
      - 'scripts/build_full_market_breakouts.py'
      - 'scripts/swing_breakouts.py'
      - 'tests/test_swing_breakouts.py'
      - 'tests/test_full_market_breakouts.py'
      - '.github/workflows/universe-full.yml'
      - '.github/workflows/schedule.yml'
      - 'docs/report/breakouts.json'
      - '.github/workflows/atlas-review.yml'
permissions:
  contents: read
concurrency:
  group: atlas-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: atlas/package-lock.json
      - name: Install dependencies
        working-directory: atlas
        run: npm ci
      - name: Unit tests, lint and build
        working-directory: atlas
        run: |
          npm test
          npm run lint
          npm run build
          npm run build:pages
          npm run refresh:watchlists
      - name: Install browsers
        working-directory: atlas
        run: npx playwright install --with-deps chromium webkit
      - name: Desktop, phone and WebKit regressions
        working-directory: atlas
        run: npm run test:site -- parameter-console.spec.ts unified-console.spec.ts screener-filters.spec.ts financials.spec.ts pe-river.spec.ts themes.spec.ts breakouts.spec.ts stock-volatility.spec.ts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline breakout integration
        run: |
          pip install requests numpy pandas
          python -m unittest discover -s tests -p 'test_atlas_watchlists.py' -v
          python -m unittest discover -s tests -p 'test_breakouts.py' -v
          python -m unittest discover -s tests -p 'test_full_market_breakouts.py' -v
          python -m unittest discover -s tests -p 'test_swing_breakouts.py' -v
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: atlas-review-browser-evidence
          path: atlas/test-results/site
          retention-days: 7
  full-market-report:
    # Read the default branch's existing cache; no data downloads, credentials or cache writes.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas
      - uses: actions/cache/restore@v4
        with:
          path: .cache/universe-full
          key: full-market-breakout-review-${{ github.run_id }}
          restore-keys: universe-full-v1-
      - name: Build real full-market entry success rates offline
        run: python scripts/build_full_market_breakouts.py --cache-dir .cache/universe-full --out /tmp/full-market-breakouts/breakouts.json
      - uses: actions/upload-artifact@v4
        with:
          name: full-market-breakouts
          path: /tmp/full-market-breakouts/breakouts.json
          if-no-files-found: error
          retention-days: 7
