name: Atlas PR verification
on:
  pull_request:
    branches: [main]
    paths:
      - 'atlas/**'
      - 'docs/report/research/**'
      - 'scripts/*research*.py'
      - 'scripts/build_sec_radar.py'
      - 'scripts/build_world_assets.py'
      - 'scripts/build_tw_chips.py'
      - 'tests/test_research.py'
      - 'tests/test_research_operations.py'
      - 'tests/fixtures/research/**'
      - '.github/workflows/research-data.yml'
      - 'breakout_alert/**'
      - 'main.py'
      - 'Dockerfile.discord-query'
      - '.github/workflows/cloud-run.yml'
      - 'supabase/functions/user-settings/**'
      - 'supabase/functions/chart-drawings/**'
      - 'supabase/functions/_shared/**'
      - 'supabase/manual/**'
      - 'supabase/tests/**'
      - 'tests/test_atlas_watchlists.py'
      - 'tests/test_account_permissions.py'
      - 'tests/test_drawing_alerts_runner.py'
      - 'tests/test_breakout_alert_index_and_names.py'
      - 'tests/test_breakouts.py'
      - 'scripts/build_breakouts.py'
      - 'scripts/build_full_market_breakouts.py'
      - 'scripts/swing_breakouts.py'
      - 'scripts/breakout_outcomes.py'
      - 'scripts/preview_swing_breakouts.py'
      - 'tests/test_swing_breakouts.py'
      - 'tests/test_breakout_outcomes.py'
      - 'tests/fixtures/breakouts/**'
      - 'tests/test_full_market_breakouts.py'
      - '.github/workflows/universe-full.yml'
      - '.github/workflows/schedule.yml'
      - 'docs/report/breakouts.json'
      - '.github/workflows/atlas-review.yml'
permissions:
  contents: read
concurrency:
  group: atlas-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  records-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: atlas/package-lock.json
      - name: Verify Atlas without restoring any generated inputs
        working-directory: atlas
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run lint
          npm run build
          VITE_PUBLIC_BASE=/my-stock-screener/atlas/ npm run build:pages
          npm run refresh:watchlists
  yahoo-annual-write-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify conservative Yahoo backfill from pinned baseline
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$PR_BASE_SHA"
          if git diff --quiet "$PR_BASE_SHA" HEAD -- docs/report/yahoo-annual-backfill.json; then
            echo 'No annual Yahoo apply receipt changed; write proof not applicable.'
            exit 0
          fi
          python -m unittest discover -s tests -p 'test_yahoo_annual_backfill.py' -v
          BASE=$(python -c "import json; print(json.load(open('docs/report/yahoo-annual-backfill-proof.json'))['base'])")
          git fetch --no-tags --depth=1 origin "$BASE"
          python atlas/scripts/backfill_yahoo_annual.py --verify-against "$BASE" --proof /tmp/yahoo-proof.json
  sec-write-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify reviewed SEC restatement write set independently
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$PR_BASE_SHA"
          if git diff --quiet "$PR_BASE_SHA" HEAD -- docs/report/sec-restated-comparatives-apply.json; then
            echo "This PR does not apply a SEC restatement manifest."
            exit 0
          fi
          python -m unittest discover -s tests -p 'test*sec_restatements.py' -v
          python atlas/scripts/apply_sec_restatements.py --verify-against "$PR_BASE_SHA"
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore generated inputs for PR readers after cutover
        if: vars.GENERATED_BRANCH_MODE == '1'
        env:
          GENERATED_BRANCH_MODE: ${{ vars.GENERATED_BRANCH_MODE }}
        run: python scripts/generated_branch.py restore
      - name: Overlay world snapshots changed by this PR
        if: vars.GENERATED_BRANCH_MODE == '1'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$PR_BASE_SHA"
          git diff --name-only --diff-filter=AM -z "$PR_BASE_SHA" HEAD -- docs/report/research docs/report/financials docs/report/fundamentals docs/report/universe.json docs/report/growth.json docs/report/kline-corrections.json data |
            xargs -0 -r git restore --source=HEAD --
          # The index hashes every member of its candle bundle. Restore that complete
          # bundle when this PR changes it, including members unchanged since main.
          # A pre-candle generated snapshot otherwise deletes those dependencies.
          if ! git diff --quiet "$PR_BASE_SHA" HEAD -- docs/report/research/world-assets.json; then
            git restore --source=HEAD -- docs/report/research/world-assets.json docs/report/research/candles data/world
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: atlas/package-lock.json
      - name: Install dependencies
        working-directory: atlas
        run: npm ci
      - name: Unit tests, lint and build
        working-directory: atlas
        run: |
          npm test
          ATLAS_RESEARCH_DIR=../docs/report/research npx vitest run tests/research-data.test.tsx tests/research-candles.test.ts
          npm run typecheck
          npm run lint
          npm run build
          VITE_PUBLIC_BASE=/my-stock-screener/atlas/ npm run build:pages
          npm run refresh:watchlists
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-pages-pr-build
          path: |
            atlas/dist-pages
            docs/report/research/
          retention-days: 7
      - name: Install browsers
        working-directory: atlas
        timeout-minutes: 8
        run: |
          # The runner's Azure HTTP mirror stalled on two attempts. Keep Ubuntu's
          # signed packages, but fetch them from the official HTTPS archive.
          sudo python3 - <<'PY'
          from pathlib import Path
          apt = Path('/etc/apt')
          paths = [apt / 'sources.list', *apt.glob('*mirrors*.txt'),
                   *(apt / 'sources.list.d').glob('*.list'),
                   *(apt / 'sources.list.d').glob('*.sources')]
          for path in paths:
              if path.is_file():
                  original = path.read_text()
                  updated = original.replace('http://azure.archive.ubuntu.com/ubuntu',
                                             'https://archive.ubuntu.com/ubuntu')
                  if updated != original:
                      path.write_text(updated)
          PY
          npx playwright install --with-deps chromium webkit
      - name: Real Pages data on desktop and iPhone WebKit
        run: |
          mkdir -p /tmp/research-pages/my-stock-screener
          cp -a atlas/dist-pages /tmp/research-pages/my-stock-screener/atlas
          ln -s "$GITHUB_WORKSPACE/docs/report" /tmp/research-pages/my-stock-screener/report
          python3 scripts/serve_research_preview.py --port 4188 --directory /tmp/research-pages > /tmp/research-pages-server.log 2>&1 &
          pages_server_pid=$!
          trap 'kill "$pages_server_pid"' EXIT
          for attempt in 1 2 3 4 5; do
            if curl -fsS http://127.0.0.1:4188/my-stock-screener/atlas/ -o /dev/null; then break; fi
            sleep 1
          done
          cd atlas
          npm run test:research-pages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-pages-live
          path: atlas/test-results/research-pages-live
          if-no-files-found: ignore
          retention-days: 7
      - name: Desktop, phone and WebKit regressions
        working-directory: atlas
        run: npm run test:site -- account-privacy.spec.ts legacy-import.spec.ts parameter-console.spec.ts unified-console.spec.ts screener-filters.spec.ts data-integrity.spec.ts financials.spec.ts pe-river.spec.ts themes.spec.ts themes-map.spec.ts breakouts.spec.ts stock-volatility.spec.ts research-modules.spec.ts drawable-research.spec.ts ma-recommendation.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-breakout-previews
          path: atlas/test-results/site/**/four-outcome-card.png
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline PostgreSQL account storage enforcement
        run: |
          set -euo pipefail
          pg_bindir="$(pg_config --bindir 2>/dev/null || true)"
          if [ ! -x "$pg_bindir/initdb" ] || [ ! -x "$pg_bindir/psql" ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql
            pg_bindir="$(find /usr/lib/postgresql -type f -name initdb -printf '%h\n' | sort -Vr | head -n 1)"
          fi
          test -x "$pg_bindir/initdb"
          test -x "$pg_bindir/psql"
          ATLAS_PG_BIN="$pg_bindir" python supabase/tests/test_account_storage_permissions.py -v
      - name: Offline breakout integration
        env:
          KLINE_CORRECTIONS_LOG: /tmp/test-kline-corrections.json
        run: |
          cp docs/report/kline-corrections.json "$KLINE_CORRECTIONS_LOG"
          pip install requests numpy pandas openpyxl xlrd lxml pyyaml
          python -m unittest discover -s tests -p test_research.py -v
          python -m unittest discover -s tests -p test_research_candles.py -v
          python -m unittest discover -s tests -p test_research_operations.py -v
          python -m unittest discover -s tests -p test_tw_chips.py -v
          python -m unittest discover -s tests -p 'test_atlas_watchlists.py' -v
          python -m unittest discover -s tests -p 'test_account_permissions.py' -v
          python -m unittest discover -s tests -p 'test_breakouts.py' -v
          python -m unittest discover -s tests -p 'test_full_market_breakouts.py' -v
          python -m unittest discover -s tests -p 'test_swing_breakouts.py' -v
          python -m unittest discover -s tests -p 'test_breakout_outcomes.py' -v
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: atlas-review-browser-evidence
          path: atlas/test-results/site
          retention-days: 7
  full-market-report:
    # Read the default branch's existing cache; no data downloads, credentials or cache writes.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Restore generated inputs for full-market readers
        if: vars.GENERATED_BRANCH_MODE == '1'
        env:
          GENERATED_BRANCH_MODE: ${{ vars.GENERATED_BRANCH_MODE }}
        run: python scripts/generated_branch.py restore
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas
      - uses: actions/cache/restore@v4
        with:
          path: .cache/universe-full
          key: full-market-breakout-review-${{ github.run_id }}
          restore-keys: universe-full-v1-
      - name: Build real full-market entry success rates offline
        run: python scripts/build_full_market_breakouts.py --cache-dir .cache/universe-full --out /tmp/full-market-breakouts/breakouts.json
      - name: Reuse the existing full-market cache for research history
        run: |
          mkdir -p /tmp/full-market-research
          cp -a docs/report/research/institutions.json docs/report/research/institutions /tmp/full-market-research/
          if [ -d docs/report/research/turnover ]; then cp -a docs/report/research/turnover /tmp/full-market-research/; fi
          python scripts/build_research.py institutional --days 0 --budget 0 --cache .cache/universe-full --out /tmp/full-market-research
          python scripts/build_research.py volume --cache .cache/universe-full --out /tmp/full-market-research
      - uses: actions/upload-artifact@v4
        with:
          name: full-market-research
          path: /tmp/full-market-research
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: full-market-breakouts
          path: /tmp/full-market-breakouts/breakouts.json
          if-no-files-found: error
          retention-days: 7
