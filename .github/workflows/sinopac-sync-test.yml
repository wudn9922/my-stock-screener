name: Read-only SinoPac tests
on:
  pull_request:
    paths:
      - 'sinopac_sync/**'
      - 'atlas/src/holdings/**'
      - 'atlas/src/cloud/settingsApi.ts'
      - 'atlas/tests/sinopac-handler.test.ts'
      - 'atlas/e2e-site/sinopac.spec.ts'
      - 'supabase/functions/user-settings/sinopac.ts'
      - 'supabase/functions/user-settings/index.ts'
      - 'tests/test_sinopac_sync.py'
      - 'Dockerfile.sinopac-sync*'
      - 'scripts/build_market_calendar.py'
      - 'supabase/manual/atlas_sinopac_sync.sql'
      - '.github/workflows/sinopac-sync*.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fake-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sinopac_sync/requirements.txt
      - run: pip install -r sinopac_sync/requirements.txt
      - run: python -m unittest discover -s tests -p test_sinopac_sync.py -v
      - run: python scripts/build_market_calendar.py --output /tmp/sinopac-calendar.json
      - run: docker build -f Dockerfile.sinopac-sync -t sinopac-sync-test:local .

  edge-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --config supabase/functions/user-settings/deno.json supabase/functions/user-settings/sinopac.ts
  stacked-frontend:
    # Main-targeted PRs already run the full Atlas PR verification workflow.
    if: github.base_ref != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: atlas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: atlas/package-lock.json
      - run: npm ci
      - run: npx vitest run tests/sinopac-handler.test.ts tests/holdings*.test.ts tests/mexc*.test.*
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:site -- sinopac.spec.ts holdings.spec.ts holdings-hide.spec.ts mexc.spec.ts
