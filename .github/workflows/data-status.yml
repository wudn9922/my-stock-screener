name: Data status
on:
  schedule:
    # Asia/Taipei 08:35 / 18:35 / 23:35 (UTC+8, no DST).
    - cron: '35 0,10,15 * * *'
  workflow_run:
    workflows: ["Daily Stock Screener", "Full-Market Universe"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  # This new producer is generated-only even if the legacy cutover switch is unset.
  GENERATED_BRANCH_MODE: '1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: data-status-generated
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'exchange-calendars>=4.5,<5.0' pandas
      - name: Restore generated read-only inputs
        id: inputs
        run: python scripts/generated_branch.py restore
      - name: Build read-only data inventory
        id: status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -u scripts/build_data_status.py
      - name: Restore rolling daily bars read-only
        uses: actions/cache/restore@v4
        with:
          path: .cache/universe-full
          key: universe-full-v1-status-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: universe-full-v1-
      - name: Build industry comparison without changing daily bars
        run: python scripts/build_industry_rotation.py
      - name: Capture public screener inputs for date comparisons
        # Independent of industry rotation: a rejected rotation keeps its previous
        # file, but must not skip today's 10-day rolling screener snapshot.
        if: always() && !cancelled() && steps.inputs.outcome == 'success'
        id: screener_history
        run: python scripts/build_screener_history.py
      - name: Capture permanent public signal cohorts
        id: signal_capture
        if: always() && !cancelled() && steps.screener_history.outcome == 'success'
        run: python scripts/build_signal_outcomes.py --capture-only
      - name: Checkout validated permanent K-line archive (read only)
        id: signal_archive
        if: always() && !cancelled() && steps.inputs.outcome == 'success'
        uses: actions/checkout@v4
        with:
          ref: kline-archive
          path: .cache/kline-archive
          fetch-depth: 1
          persist-credentials: false
      - name: Calculate public signal outcomes
        if: always() && !cancelled() && steps.signal_capture.outcome == 'success' && steps.signal_archive.outcome == 'success'
        run: python scripts/build_signal_outcomes.py --outcomes-only
      - name: Build public upcoming events and earnings moves (offline)
        if: always() && !cancelled() && steps.signal_archive.outcome == 'success'
        run: python scripts/build_upcoming_events.py
      - name: Publish only status-owned outputs
        # The existing publisher rebases ONLY this owner's delta onto each fresh
        # generated tip and retries non-force pushes; other owners are preserved.
        if: always() && !cancelled() && steps.inputs.outcome == 'success' && steps.status.outcome == 'success'
        run: python scripts/generated_branch.py publish status
  notify-system-failure:
    needs: ["build"]
    if: ${{ always() && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (failure() || cancelled()) }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/notify-failure.yml
    with:
      title: "${{ github.workflow }} · ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && '執行失敗／取消' || '部分失敗' }}"
      needs-json: ${{ toJSON(needs) }}
    secrets:
      DISCORD_WEBHOOK_URL1: ${{ secrets.DISCORD_WEBHOOK_URL1 }}
      LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
      LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
