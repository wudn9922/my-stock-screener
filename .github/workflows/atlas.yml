name: Atlas Research Terminal

# 建置 Atlas（行情改由 Supabase Edge Function 即時代理，不再產生個股快照檔），
# 並在建置時產生全市場股票目錄與本益比資料（美股 Yahoo、台股證交所／櫃買中心），部署到 docs/atlas/
# （GitHub Pages：/my-stock-screener/atlas/）。只會替換 docs/atlas/。
on:
  workflow_run:
    workflows: ["Daily Stock Screener"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'atlas/**'
      - '.github/workflows/atlas.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

# 獨立群組：若與 schedule.yml 共用，排隊中的 Atlas 執行可能取代排隊中的每日報告。
# 與每日報告同時推送的衝突由下方 pull --rebase --autostash + 重試處理。
concurrency:
  group: atlas-research-terminal
  cancel-in-progress: false

jobs:
  build-and-deploy:
    # workflow_run 只有在每日報告成功時才繼續
    if: >-
      github.event_name != 'workflow_run'
      || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: atlas/package-lock.json

      - name: Install Atlas dependencies
        working-directory: atlas
        run: npm ci

      - name: Run Atlas unit tests
        working-directory: atlas
        run: npm test

      # 產生的資料只放在 git-ignored 路徑（atlas/public/symbols/directory.json、atlas/public/valuation/），
      # 先帶入上次部署的版本：來源暫時失敗時仍保留最後一次成功的資料。
      - name: Seed generated data from the last deployment
        run: |
          set -euo pipefail
          if [ -f docs/atlas/symbols/directory.json ]; then
            mkdir -p atlas/public/symbols
            cp docs/atlas/symbols/directory.json atlas/public/symbols/directory.json
            echo "已帶入上次部署的股票目錄"
          fi
          if [ -d docs/atlas/valuation ]; then
            mkdir -p atlas/public/valuation
            cp -a docs/atlas/valuation/. atlas/public/valuation/
            echo "已帶入上次部署的本益比資料"
          fi

      - name: Build full-market symbol directory (TWSE / TPEx / US)
        id: directory
        continue-on-error: true
        working-directory: atlas
        run: node scripts/build-directory.mjs

      # 美股本益比改用 Yahoo：SEC 對 GitHub Actions 的 IP 一律回 403（與 User-Agent 無關），
      # Yahoo 的報價／財報端點則會對 Node fetch 回 429，所以用 Python + curl_cffi（模擬 Chrome TLS）。
      - name: Set up Python (US valuation)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build US valuation data (Yahoo Finance)
        id: valuation_us
        continue-on-error: true
        working-directory: atlas
        run: |
          pip install --quiet 'curl_cffi>=0.7,<1'
          python scripts/build_valuation_us.py

      # 選股篩選器的美股基本面（季 EPS／營收 YoY）：股票來源為 docs/report 的 universe／報告群組／題材，
      # 沒有時退回 data/*.csv；與上次部署的 us-growth.json 依季度合併（最多 12 季），只重抓過期的股票。
      - name: Build US growth data (Yahoo Finance)
        id: valuation_growth
        continue-on-error: true
        working-directory: atlas
        env:
          YAHOO_GROWTH_BUDGET_SECONDS: '600'
        run: |
          pip install --quiet 'curl_cffi>=0.7,<1'
          python scripts/build_fundamentals_us.py

      # 證交所／櫃買中心的財報開放資料只有「最新一季」（累計），只有 3～5 月是全年度（Q4），
      # 其餘月份台股年度 EPS 全部是 null，「本益比」欄位就一直空白。改由 Yahoo 補年度 EPS（新台幣），
      # 寫入 valuation/tw-annual.json，下一步建 tw.json 時合併（同一年度仍以官方 Q4 為準）。
      - name: Build Taiwan annual EPS (Yahoo Finance)
        id: valuation_tw_annual
        continue-on-error: true
        working-directory: atlas
        env:
          YAHOO_TW_ANNUAL_BUDGET_SECONDS: '480'
        run: |
          pip install --quiet 'curl_cffi>=0.7,<1'
          python scripts/build_valuation_tw_annual.py

      - name: Build Taiwan valuation data (TWSE / TPEx)
        id: valuation
        continue-on-error: true
        working-directory: atlas
        run: node scripts/build-valuation.mjs --market=tw

      - name: Build Atlas for GitHub Pages
        working-directory: atlas
        env:
          VITE_PUBLIC_BASE: /my-stock-screener/atlas/
          VITE_MARKET_PROXY_URL: ${{ vars.MARKET_PROXY_URL || 'https://bxhqpfeberqbtxymghyt.supabase.co/functions/v1/market-chart' }}
        run: npm run build:pages

      - name: Replace docs/atlas with build output
        run: |
          set -euo pipefail
          if [ ! -f atlas/dist-pages/index.html ]; then
            echo "::error::atlas/dist-pages/index.html 不存在，停止部署"
            exit 1
          fi
          for file in symbols/directory.json valuation/us.json valuation/tw.json; do
            if [ ! -f "atlas/dist-pages/${file}" ]; then
              echo "::warning::建置結果缺少 ${file}（搜尋或本益比會降級顯示）"
            fi
          done
          # 只動 docs/atlas；docs/report/、docs/index.html、docs/*.png 一律不碰
          rm -rf docs/atlas
          mkdir -p docs/atlas
          cp -a atlas/dist-pages/. docs/atlas/
          # GitHub Pages 的 Jekyll 會略過底線開頭的檔案；若有這類檔案，補上 docs/.nojekyll
          if find docs/atlas -name '_*' -print -quit | grep -q .; then
            echo "偵測到底線開頭的檔案，建立 docs/.nojekyll"
            touch docs/.nojekyll
          fi
          du -sh docs/atlas
          du -sh docs/atlas/symbols docs/atlas/valuation 2>/dev/null || true

      - name: Commit and push docs/atlas
        run: |
          set -euo pipefail
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          # 建置不應修改任何受版本控制的檔案；若有，還原它們，避免 pull --rebase 被擋下。
          if ! git diff --quiet -- atlas; then
            echo "::warning::建置修改了受版本控制的檔案，已還原："
            git diff --name-only -- atlas
            git checkout -- atlas
          fi
          git add -A docs/atlas
          if [ -f docs/.nojekyll ]; then
            git add docs/.nojekyll
          fi
          if git diff --cached --quiet; then
            echo "docs/atlas 沒有變更，不需提交"
            exit 0
          fi
          git commit -m "Auto-update Atlas research terminal"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "推送成功（第 ${attempt} 次）"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "推送失敗（第 ${attempt} 次），稍後重試"
            sleep $((attempt * 15))
          done
          echo "::error::推送 docs/atlas 失敗（已重試 3 次）"
          exit 1

      - name: Report data refresh problems
        if: always()
        env:
          DIRECTORY_OUTCOME: ${{ steps.directory.outcome }}
          VALUATION_OUTCOME: ${{ steps.valuation.outcome }}
          VALUATION_US_OUTCOME: ${{ steps.valuation_us.outcome }}
          VALUATION_TW_ANNUAL_OUTCOME: ${{ steps.valuation_tw_annual.outcome }}
          VALUATION_GROWTH_OUTCOME: ${{ steps.valuation_growth.outcome }}
        run: |
          set -euo pipefail
          if [ "$DIRECTORY_OUTCOME" = "failure" ]; then
            echo "::warning::股票目錄更新失敗，沿用上次部署的 symbols/directory.json（若無則退回台股目錄）"
          fi
          if [ "$VALUATION_US_OUTCOME" = "failure" ]; then
            echo "::warning::美股本益比（Yahoo）更新失敗，沿用上次部署的 valuation/us.json"
          fi
          if [ "$VALUATION_GROWTH_OUTCOME" = "failure" ]; then
            echo "::warning::美股基本面成長（Yahoo）更新失敗或未完成，沿用上次部署的 valuation/us-growth.json"
          fi
          if [ "$VALUATION_TW_ANNUAL_OUTCOME" = "failure" ]; then
            echo "::warning::台股年度 EPS（Yahoo）更新失敗，沿用上次部署的 valuation/tw-annual.json"
          fi
          if [ "$VALUATION_OUTCOME" = "failure" ]; then
            echo "::warning::台股本益比部分或全部更新失敗，沿用上次部署的 valuation/tw.json"
          fi

      # 不依賴 Claude 的故障通知：本 job 失敗或逾時（取消）時推播 LINE
      - name: Notify LINE on failure
        if: failure() || cancelled()
        env:
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          TITLE: "Atlas 網站更新"
          RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${LINE_ACCESS_TOKEN}" ] || [ -z "${LINE_USER_ID}" ]; then
            echo "::warning::未設定 LINE_ACCESS_TOKEN / LINE_USER_ID，無法推播故障通知"
            exit 0
          fi
          text=$(printf '⚠️ %s %s\n台灣時間 %s\n%s' "${TITLE}" \
            "$([ "${RESULT}" = cancelled ] && echo '逾時或被取消' || echo '執行失敗')" \
            "$(TZ=Asia/Taipei date '+%m/%d %H:%M')" "${RUN_URL}")
          jq -n --arg to "${LINE_USER_ID}" --arg text "${text}" \
            '{to: $to, messages: [{type: "text", text: $text}]}' |
            curl -sS --fail-with-body --max-time 30 -X POST https://api.line.me/v2/bot/message/push \
              -H "Authorization: Bearer ${LINE_ACCESS_TOKEN}" -H 'Content-Type: application/json' -d @- ||
            echo "::warning::LINE 故障通知推播失敗"
