name: Squash generated snapshot
on:
  schedule:
    # UTC 22:11 / Taipei 06:11, after evening jobs and the 19:37 UTC fundamentals budget.
    - cron: '11 22 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: generated-maintenance
  cancel-in-progress: false
jobs:
  squash:
    if: vars.GENERATED_BRANCH_MODE == '1' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace generated history with exactly the same current tree
        env:
          GENERATED_BRANCH_MODE: ${{ vars.GENERATED_BRANCH_MODE }}
        run: python scripts/generated_branch.py squash
  notify-system-failure:
    needs: ["squash"]
    if: ${{ always() && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (failure() || cancelled()) }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/notify-failure.yml
    with:
      title: "${{ github.workflow }} · ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && '執行失敗／取消' || '部分失敗' }}"
      needs-json: ${{ toJSON(needs) }}
    secrets:
      DISCORD_WEBHOOK_URL1: ${{ secrets.DISCORD_WEBHOOK_URL1 }}
      LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
      LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
