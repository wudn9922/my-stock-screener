name: Squash generated snapshot
on:
  schedule:
    - cron: '11 21 * * 0'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: generated-maintenance
  cancel-in-progress: false
jobs:
  squash:
    if: vars.GENERATED_BRANCH_MODE == '1' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace generated history with exactly the same current tree
        env:
          GENERATED_BRANCH_MODE: ${{ vars.GENERATED_BRANCH_MODE }}
        run: python scripts/generated_branch.py squash
