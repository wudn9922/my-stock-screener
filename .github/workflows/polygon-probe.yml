name: Polygon Q4 EPS probe (manual, read-only)

# Read-only probe: does Polygon.io carry a diluted EPS value for the US Q4 rows the repo is missing?
# Manual only. Nothing is committed and nothing is written under docs/report/financials.
# The run calls Polygon at 5 requests per minute (one every 12 seconds), so 4,100 symbols need about 820 minutes:
# each dispatch covers about 1,600 symbols, and the checkpoint carries the rest to the next dispatch.
# The checkpoint holds flags only (no EPS value) and is kept in the Actions cache between dispatches.
# Outputs: the artifact "polygon-probe" (report.json and run.log), and report.json committed by the commit job to the
# orphan branch runs/source-probes under docs/report/source-probes/polygon/<run_id>/. The report holds counts, keys and
# flags only. Only the commit job has contents: write. It runs an inline guard (python3 -I) before committing: exactly one
# added file, the run's report.json; numeric run id; schema polygon-q4-probe-report-v1; floats only under wilson_lower_95.

on:
  workflow_dispatch:
    inputs:
      fresh:
        description: 'Ignore the saved checkpoint and start over'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: polygon-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Most recent checkpoint saved by an earlier dispatch (restore-keys picks the newest match)
      - name: Restore checkpoint
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/polygon-probe/checkpoint.jsonl
          key: polygon-probe-none-${{ github.run_id }}
          restore-keys: polygon-probe-

      - name: Run probe
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          FRESH: ${{ inputs.fresh }}
        run: |
          mkdir -p "$RUNNER_TEMP/polygon-probe"
          args=(--checkpoint "$RUNNER_TEMP/polygon-probe/checkpoint.jsonl"
                --report "$RUNNER_TEMP/polygon-probe/report.json"
                --log "$RUNNER_TEMP/polygon-probe/run.log"
                --budget-minutes 320)
          if [ "$FRESH" = "true" ]; then
            args+=(--fresh)
          fi
          python3 -u atlas/scripts/probe_polygon_q4.py "${args[@]}"

      - name: Check checkpoint exists
        id: ckpt
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/polygon-probe/checkpoint.jsonl" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # Saved even when the run stopped at the time budget or failed, so the next dispatch resumes
      - name: Save checkpoint
        if: always() && steps.ckpt.outputs.present == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/polygon-probe/checkpoint.jsonl
          key: polygon-probe-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polygon-probe
          path: |
            ${{ runner.temp }}/polygon-probe/report.json
            ${{ runner.temp }}/polygon-probe/run.log
          if-no-files-found: error

  # The only job with write access. It commits report.json and nothing else.
  commit:
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RUNS_BRANCH: runs/source-probes
      RUN_ID: ${{ github.run_id }}
      RUN_NUMBER: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download report
        uses: actions/download-artifact@v4
        with:
          name: polygon-probe
          path: ${{ runner.temp }}/polygon-probe-artifact

      - name: Commit report to runs branch
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/polygon-probe-artifact/report.json"
          [ -f "$src" ] || { echo "::error::no report.json to commit"; exit 1; }
          dest="docs/report/source-probes/polygon/$RUN_ID"
          wt="$RUNNER_TEMP/runs-wt"
          main_sha="$(git rev-parse HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$RUNS_BRANCH" >/dev/null 2>&1; then
            git fetch -q origin "$RUNS_BRANCH"
            git worktree add -q --detach "$wt" FETCH_HEAD
          else
            git worktree add -q --orphan -b "$RUNS_BRANCH" "$wt"
          fi
          mkdir -p "$wt/$dest"
          cp "$src" "$wt/$dest/report.json"
          cd "$wt"
          git add -- "$dest"
          git diff --cached --name-status > "$RUNNER_TEMP/staged.txt"
          if [ ! -s "$RUNNER_TEMP/staged.txt" ]; then echo "nothing to commit"; exit 0; fi
          python3 -I - "$RUN_ID" "$dest" "$wt/$dest/report.json" "$RUNNER_TEMP/staged.txt" <<'PY'
          import json
          import math
          import re
          import sys

          run_id, dest, report_path, staged_path = sys.argv[1:5]


          def refuse(message):
              print("refused: " + message, file=sys.stderr)
              sys.exit(1)


          if not re.fullmatch(r"[0-9]+", run_id):
              refuse("run id is not numeric")
          if dest != "docs/report/source-probes/polygon/" + run_id:
              refuse("destination is not the run directory")
          with open(report_path, encoding="utf-8") as handle:
              report = json.load(handle)
          if not isinstance(report, dict) or report.get("schema") != "polygon-q4-probe-report-v1":
              refuse("report schema is not polygon-q4-probe-report-v1")
          bad_keys = set()


          def walk(node, key):
              if isinstance(node, dict):
                  for name, value in node.items():
                      walk(value, name)
              elif isinstance(node, list):
                  for value in node:
                      walk(value, key)
              elif isinstance(node, float):
                  if key != "wilson_lower_95" or not math.isfinite(node):
                      bad_keys.add(str(key))


          walk(report, "")
          if bad_keys:
              refuse("float outside wilson_lower_95 under: " + ", ".join(sorted(bad_keys)))
          with open(staged_path, encoding="utf-8") as handle:
              lines = [line for line in handle.read().splitlines() if line]
          if len(lines) != 1:
              refuse("expected exactly one staged change, found " + str(len(lines)))
          if lines[0].split("\t") != ["A", dest + "/report.json"]:
              refuse("staged change is not the addition of the run's report.json")
          print("guard passed: one added report, schema ok, floats limited to wilson_lower_95")
          PY
          git commit -q -m "Polygon Q4 probe run $RUN_NUMBER ($RUN_ID): report [main $main_sha]"
          for i in 1 2 3 4; do
            if git push -q origin "HEAD:refs/heads/$RUNS_BRANCH"; then exit 0; fi
            sleep $((2 ** i))
            git fetch -q origin "$RUNS_BRANCH"
            git rebase -q FETCH_HEAD || exit 1
          done
          exit 1
