name: Deploy Supabase Edge Functions

# 部署 Atlas 行情代理 market-chart、畫線雲端同步 chart-drawings 與自選股設定頁的 user-settings（supabase/functions/）。
# 需要 repository secret SUPABASE_ACCESS_TOKEN（Supabase 個人存取權杖）；未設定時略過，不會失敗。
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/market-chart/**'
      - 'supabase/functions/user-settings/**'
      - 'supabase/functions/chart-drawings/**'
      - '.github/workflows/supabase-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-functions
  cancel-in-progress: false

jobs:
  deploy-market-chart:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'bxhqpfeberqbtxymghyt' }}
    steps:
      - name: Check for SUPABASE_ACCESS_TOKEN
        id: token
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::notice::未設定 secret SUPABASE_ACCESS_TOKEN，略過函式部署（請在 Settings → Secrets and variables → Actions 新增）"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.token.outputs.available == 'true'
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        if: steps.token.outputs.available == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy market-chart
        if: steps.token.outputs.available == 'true'
        run: supabase functions deploy market-chart --no-verify-jwt --project-ref "${SUPABASE_PROJECT_REF}"

      - name: Deploy user-settings
        if: steps.token.outputs.available == 'true'
        run: supabase functions deploy user-settings --no-verify-jwt --project-ref "${SUPABASE_PROJECT_REF}"

      - name: Deploy chart-drawings
        if: steps.token.outputs.available == 'true'
        run: supabase functions deploy chart-drawings --no-verify-jwt --project-ref "${SUPABASE_PROJECT_REF}"

      - name: Smoke test
        # 不論這次是否由本 workflow 部署（例如改用 Supabase connector 部署），都實際呼叫一次函式
        if: always()
        run: |
          set -uo pipefail
          url="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/market-chart"
          failed=0
          check() {
            local label="$1" query="$2" expect="$3"
            local code bars
            code=$(curl -s -o /tmp/chart.json -w '%{http_code}' --max-time 30 "${url}?${query}")
            bars=$(python3 -c 'import json,sys
          try:
              d=json.load(open("/tmp/chart.json")); r=(d.get("chart") or {}).get("result") or []
              print(len(r[0].get("timestamp") or []) if r else "-")
          except Exception: print("-")')
            echo "${label} → HTTP ${code}, bars=${bars}, $(wc -c < /tmp/chart.json) bytes"
            if [ "${code}" != "${expect}" ]; then
              echo "::warning::${label}: 預期 HTTP ${expect}，得到 ${code}：$(head -c 300 /tmp/chart.json)"
              failed=1
            fi
          }
          check "invalid interval" "symbol=NVDA&interval=99x&range=5y" 400
          check "2330.TW 1d/1mo" "symbol=2330.TW&interval=1d&range=1mo" 200
          check "6488.TWO 1d/1mo" "symbol=6488.TWO&interval=1d&range=1mo" 200
          check "^TWII 1d/1mo" "symbol=%5ETWII&interval=1d&range=1mo" 200
          check "AAPL 1d/1mo" "symbol=AAPL&interval=1d&range=1mo&events=0" 200
          check "NVDA 5m/5d" "symbol=NVDA&interval=5m&range=5d" 200
          check "000001.SS 1d/1mo" "symbol=000001.SS&interval=1d&range=1mo" 200
          # user-settings：未帶 LIFF ID Token 應回 401（不需要真的登入）
          code=$(curl -s -o /tmp/settings.json -w '%{http_code}' --max-time 30 -X POST \
            -H 'Content-Type: application/json' -d '{"action":"stocks.list"}' \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/user-settings")
          echo "user-settings without token → HTTP ${code}: $(head -c 200 /tmp/settings.json)"
          if [ "${code}" != "401" ]; then
            echo "::warning::user-settings 預期 HTTP 401，得到 ${code}"
            failed=1
          fi
          # chart-drawings：假的 LIFF ID Token 應被 LINE 拒絕並回 401
          code=$(curl -s -o /tmp/drawings.json -w '%{http_code}' --max-time 30 -X POST \
            -H 'Content-Type: application/json' -d '{"action":"atlas.list","idToken":"invalid.token.value"}' \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/chart-drawings")
          echo "chart-drawings with invalid token → HTTP ${code}: $(head -c 200 /tmp/drawings.json)"
          if [ "${code}" != "401" ]; then
            echo "::warning::chart-drawings 預期 HTTP 401，得到 ${code}"
            failed=1
          fi
          if [ "${failed}" != "0" ]; then
            echo "::warning::market-chart 有請求未得到預期結果；HTTP 200 以外多半是 Yahoo 封鎖或限流了 Supabase 的出口 IP"
            exit 1
          fi

      # 不依賴 Claude 的故障通知：本 job 失敗或逾時（取消）時推播 LINE
      - name: Notify LINE on failure
        if: failure() || cancelled()
        env:
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          TITLE: "Supabase 函式部署／冒煙測試"
          RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${LINE_ACCESS_TOKEN}" ] || [ -z "${LINE_USER_ID}" ]; then
            echo "::warning::未設定 LINE_ACCESS_TOKEN / LINE_USER_ID，無法推播故障通知"
            exit 0
          fi
          text=$(printf '⚠️ %s %s\n台灣時間 %s\n%s' "${TITLE}" \
            "$([ "${RESULT}" = cancelled ] && echo '逾時或被取消' || echo '執行失敗')" \
            "$(TZ=Asia/Taipei date '+%m/%d %H:%M')" "${RUN_URL}")
          jq -n --arg to "${LINE_USER_ID}" --arg text "${text}" \
            '{to: $to, messages: [{type: "text", text: $text}]}' |
            curl -sS --fail-with-body --max-time 30 -X POST https://api.line.me/v2/bot/message/push \
              -H "Authorization: Bearer ${LINE_ACCESS_TOKEN}" -H 'Content-Type: application/json' -d @- ||
            echo "::warning::LINE 故障通知推播失敗"
