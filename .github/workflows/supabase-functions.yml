name: Deploy Supabase Edge Functions

# 部署 Atlas 行情代理 market-chart、畫線雲端同步 chart-drawings、自選股設定頁的 user-settings 與監控訊號 monitor-signals（supabase/functions/）。
# 需要 repository secret SUPABASE_ACCESS_TOKEN（Supabase 個人存取權杖）；未設定時略過，不會失敗。
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/market-chart/**'
      - 'supabase/functions/user-settings/**'
      - 'supabase/functions/_shared/**'
      - 'supabase/functions/chart-drawings/**'
      - 'supabase/functions/monitor-signals/**'
      - 'supabase/manual/atlas_statement_sync.sql'
      - '.github/workflows/supabase-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-functions
  cancel-in-progress: false

jobs:
  deploy-market-chart:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'bxhqpfeberqbtxymghyt' }}
    steps:
      - name: Check for SUPABASE_ACCESS_TOKEN
        id: token
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::notice::未設定 secret SUPABASE_ACCESS_TOKEN，略過函式部署（請在 Settings → Secrets and variables → Actions 新增）"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.token.outputs.available == 'true'
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        if: steps.token.outputs.available == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy market-chart
        if: steps.token.outputs.available == 'true'
        run: supabase functions deploy market-chart --no-verify-jwt --project-ref "${SUPABASE_PROJECT_REF}" --yes

      - name: Apply statement sync SQL
        # Idempotent (create if not exists / create or replace); runs before user-settings so the
        # function never meets a missing table. Uses the Management API with the same access token.
        if: steps.token.outputs.available == 'true'
        run: |
          set -euo pipefail
          jq -Rs '{query: .}' supabase/manual/atlas_statement_sync.sql > "${RUNNER_TEMP}/statement-sql.json"
          curl -fsS --retry 2 -o /dev/null -X POST \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H 'Content-Type: application/json' \
            --data-binary @"${RUNNER_TEMP}/statement-sql.json" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query"
          echo "atlas_statement_sync.sql applied"

      - name: Deploy user-settings
        if: steps.token.outputs.available == 'true'
        run: supabase functions deploy user-settings --no-verify-jwt --project-ref "${SUPABASE_PROJECT_REF}" --yes

      - name: Deploy chart-drawings
        if: steps.token.outputs.available == 'true'
        run: supabase functions deploy chart-drawings --no-verify-jwt --project-ref "${SUPABASE_PROJECT_REF}" --yes

      - name: Deploy monitor-signals
        if: steps.token.outputs.available == 'true'
        run: supabase functions deploy monitor-signals --no-verify-jwt --project-ref "${SUPABASE_PROJECT_REF}" --yes

      - name: Smoke test
        # 不論這次是否由本 workflow 部署（例如改用 Supabase connector 部署），都實際呼叫一次函式
        if: always()
        run: |
          set -uo pipefail
          url="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/market-chart"
          failed=0
          check() {
            local label="$1" query="$2" expect="$3"
            local code bars
            code=$(curl -s -o /tmp/chart.json -w '%{http_code}' --max-time 30 "${url}?${query}")
            bars=$(python3 -c 'import json,sys
          try:
              d=json.load(open("/tmp/chart.json")); r=(d.get("chart") or {}).get("result") or []
              print(len(r[0].get("timestamp") or []) if r else "-")
          except Exception: print("-")')
            echo "${label} → HTTP ${code}, bars=${bars}, $(wc -c < /tmp/chart.json) bytes"
            if [ "${code}" != "${expect}" ]; then
              echo "::warning::${label}: 預期 HTTP ${expect}，得到 ${code}：$(head -c 300 /tmp/chart.json)"
              failed=1
            fi
          }
          # market-chart 需要登入（X-Atlas-Token）：未帶或帶假的 token 都應回 401，不會打到 Yahoo
          check "market-chart without token" "symbol=2330.TW&interval=1d&range=1mo" 401
          code=$(curl -s -o /tmp/chart.json -w '%{http_code}' --max-time 30 -H 'X-Atlas-Token: invalid.token.value.for.smoke' \
            "${url}?symbol=AAPL&interval=1d&range=1mo")
          echo "market-chart with invalid token → HTTP ${code}: $(head -c 200 /tmp/chart.json)"
          if [ "${code}" != "401" ]; then
            echo "::warning::market-chart（假 token）預期 HTTP 401，得到 ${code}"
            failed=1
          fi
          # user-settings：未帶 LIFF ID Token 應回 401（不需要真的登入）
          code=$(curl -s -o /tmp/settings.json -w '%{http_code}' --max-time 30 -X POST \
            -H 'Content-Type: application/json' -d '{"action":"stocks.list"}' \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/user-settings")
          echo "user-settings without token → HTTP ${code}: $(head -c 200 /tmp/settings.json)"
          if [ "${code}" != "401" ]; then
            echo "::warning::user-settings 預期 HTTP 401，得到 ${code}"
            failed=1
          fi
          # chart-drawings：假的 LIFF ID Token 應被 LINE 拒絕並回 401
          code=$(curl -s -o /tmp/drawings.json -w '%{http_code}' --max-time 30 -X POST \
            -H 'Content-Type: application/json' -d '{"action":"atlas.list","idToken":"invalid.token.value"}' \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/chart-drawings")
          echo "chart-drawings with invalid token → HTTP ${code}: $(head -c 200 /tmp/drawings.json)"
          if [ "${code}" != "401" ]; then
            echo "::warning::chart-drawings 預期 HTTP 401，得到 ${code}"
            failed=1
          fi
          # monitor-signals：假的 LIFF ID Token 應被 LINE 拒絕並回 401
          code=$(curl -s -o /tmp/monitor.json -w '%{http_code}' --max-time 30 -X POST \
            -H 'Content-Type: application/json' -d '{"action":"list","idToken":"invalid.token.value"}' \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/monitor-signals")
          echo "monitor-signals with invalid token → HTTP ${code}: $(head -c 200 /tmp/monitor.json)"
          if [ "${code}" != "401" ]; then
            echo "::warning::monitor-signals 預期 HTTP 401，得到 ${code}"
            failed=1
          fi
          if [ "${failed}" != "0" ]; then
            echo "::warning::有函式未得到預期結果（market-chart 現在需要登入，匿名請求應為 401）"
            exit 1
          fi

  notify-system-failure:
    needs: ["deploy-market-chart"]
    if: ${{ always() && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (failure() || cancelled()) }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/notify-failure.yml
    with:
      title: "${{ github.workflow }} · ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && '執行失敗／取消' || '部分失敗' }}"
      needs-json: ${{ toJSON(needs) }}
    secrets:
      DISCORD_WEBHOOK_URL1: ${{ secrets.DISCORD_WEBHOOK_URL1 }}
      LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
      LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
