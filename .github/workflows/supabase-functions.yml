name: Deploy Supabase Edge Functions

# 部署 Atlas 行情代理 market-chart（supabase/functions/market-chart）。
# 需要 repository secret SUPABASE_ACCESS_TOKEN（Supabase 個人存取權杖）；未設定時略過，不會失敗。
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/market-chart/**'
      - '.github/workflows/supabase-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-functions
  cancel-in-progress: false

jobs:
  deploy-market-chart:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'bxhqpfeberqbtxymghyt' }}
    steps:
      - name: Check for SUPABASE_ACCESS_TOKEN
        id: token
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::notice::未設定 secret SUPABASE_ACCESS_TOKEN，略過 market-chart 部署（請在 Settings → Secrets and variables → Actions 新增）"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.token.outputs.available == 'true'
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        if: steps.token.outputs.available == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy market-chart
        if: steps.token.outputs.available == 'true'
        run: supabase functions deploy market-chart --no-verify-jwt --project-ref "${SUPABASE_PROJECT_REF}"

      - name: Smoke test
        if: steps.token.outputs.available == 'true'
        run: |
          set -euo pipefail
          url="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/market-chart"
          code=$(curl -s -o /dev/null -w '%{http_code}' "${url}?symbol=NVDA&interval=99x&range=5y")
          echo "invalid request → HTTP ${code}"
          if [ "${code}" != "400" ]; then
            echo "::warning::market-chart 未回應預期的 400（得到 ${code}）"
          fi
          code=$(curl -s -o /tmp/chart.json -w '%{http_code}' "${url}?symbol=AAPL&interval=1d&range=1mo&events=0")
          echo "AAPL 1d/1mo → HTTP ${code} ($(wc -c < /tmp/chart.json) bytes)"
          if [ "${code}" != "200" ]; then
            echo "::warning::market-chart 無法取得 Yahoo 行情（HTTP ${code}）；可能是 Yahoo 封鎖了 Supabase 的出口 IP"
          fi
