name: Refresh US Rates

# Rebuild the Treasury JSON as soon as its generator/contract changes, independently of Atlas.
# This avoids a deployed Atlas UI referencing columns that the daily data job has not emitted.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-us-rates.yml'
      - 'scripts/build_rates.py'
      - 'scripts/rates_analytics.py'
      - 'scripts/rates_config.py'
      - 'tests/test_rates.py'

permissions:
  contents: write

concurrency:
  group: refresh-us-rates
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install rate builder dependencies
        run: pip install --quiet requests

      - name: Regenerate synthetic test fixtures
        run: python tests/rates_synth.py

      - name: Test US rates builder
        run: python -m unittest discover -s tests -p test_rates.py

      - name: Rebuild US Treasury reports
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -u scripts/build_rates.py

      - name: Verify the published rates contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          # What the Atlas rates page reads: the 10Y yield and policy range, the 10Y-3M spread summary,
          # the ETF model durations, and four history series (10Y-Fed is derived in the browser).
          reports = Path("docs/report")
          rates = json.loads((reports / "rates.json").read_text(encoding="utf-8"))
          history = json.loads((reports / "rates-history.json").read_text(encoding="utf-8"))

          observed = [s["key"] for s in rates["spreads"]]
          assert observed == ["10y3m"], observed
          assert rates["spreads"][0]["valueBp"] is not None, "10Y-3M spread has no recent value"

          assert rates["policy"] and rates["policy"]["upper"] is not None and rates["policy"]["lower"] is not None
          now = next(c for c in rates["curves"]["nominal"] if c["key"] == "now")
          assert now["values"][rates["tenors"].index("10Y")] is not None, "no current 10Y yield"
          assert rates["etfs"], "no ETFs"
          for etf in rates["etfs"]:
              model = etf.get("model") or {}
              assert model.get("duration") and model.get("convexity"), f"{etf['symbol']} has no model duration"

          expected = {"DGS10", "DGS3MO", "DFEDTARU", "DFEDTARL"}
          for kind in ("weekly", "daily"):
              block = history[kind]
              assert set(block["series"]) == expected, (kind, sorted(block["series"]))
              for symbol, series in block["series"].items():
                  assert len(series) == len(block["dates"]), f"{kind} malformed {symbol}"
                  assert any(value is not None for value in series), f"{kind} has no {symbol} values"
          print("PASS: rates summary and the four history series are available")
          PY

      - name: Commit updated US Treasury reports
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- docs/report/rates.json docs/report/rates-history.json tests/fixtures/rates/sample-rates.json tests/fixtures/rates/sample-rates-history.json
          if git diff --cached --quiet; then
            echo "Rates reports unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "Refresh US rates"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "US rates reports pushed successfully."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push retry ${attempt}/3"
            sleep $((attempt * 10))
          done
          exit 1
