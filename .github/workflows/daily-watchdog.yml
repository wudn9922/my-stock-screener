name: Daily Report Watchdog

# Preserve the six-hour daily-report window; inspect data freshness every day,
# including weekends, against the published TW/US completed-session calendar.
on:
  schedule:
    - cron: '23 17 * * *'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
concurrency:
  group: daily-report-watchdog-state
  cancel-in-progress: false
jobs:
  check:
    outputs:
      notify_partial: ${{ steps.collect_notification_outcomes.outputs.has_partial }}
      notify_summary: ${{ steps.collect_notification_outcomes.outputs.summary }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Restore small notification state only
        id: health_cache_restore
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .cache/system-data-watchdog/state.json
          key: data-health-notices-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: data-health-notices-v1-
      - name: Inspect completed-session data dates and the previous daily report
        id: health
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATED_BRANCH_MODE: ${{ vars.GENERATED_BRANCH_MODE }}
        run: python scripts/check_data_freshness.py
      - name: Notify stale data or recovery with the dedicated system channel
        id: health_notice
        if: steps.health.outputs.has_events == 'true'
        continue-on-error: true
        uses: ./.github/actions/notify-failure
        with:
          title: ${{ steps.health.outputs.title }}
          summary: ${{ steps.health.outputs.summary }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          workflow: ${{ github.workflow }}
          event: ${{ github.event_name }}
          discord-webhook: ${{ secrets.DISCORD_WEBHOOK_URL1 }}
          line-access-token: ${{ secrets.LINE_ACCESS_TOKEN }}
          line-user-id: ${{ secrets.LINE_USER_ID }}
          github-token: ${{ github.token }}
      - name: Commit notice state only after delivery or a healthy no-notice check
        id: commit_health_state
        continue-on-error: true
        if: steps.health.outputs.state_changed == 'true' && (steps.health.outputs.has_events != 'true' || steps.health_notice.outputs.delivered == 'true')
        run: python scripts/check_data_freshness.py --commit
      - name: Save only small date/status dedupe state
        if: steps.commit_health_state.outcome == 'success'
        id: health_cache_save
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .cache/system-data-watchdog/state.json
          key: data-health-notices-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Collect partial failure outcomes without changing this job result
        id: collect_notification_outcomes
        if: always() && !cancelled()
        continue-on-error: true
        env:
          NOTIFY_STEP_RESULTS: ${{ toJSON(steps) }}
          NOTIFY_STEP_NAMES: '{"health_cache_restore": "Restore small notification state only", "health_notice": "Notify stale data or recovery with the dedicated system channel", "health_cache_save": "Save only small date/status dedupe state", "commit_health_state": "Commit notice state only after delivery or a healthy no-notice check"}'
        run: |
          python - <<'PY'
          import json, os
          steps = json.loads(os.environ['NOTIFY_STEP_RESULTS'])
          names = json.loads(os.environ['NOTIFY_STEP_NAMES'])
          failed = [label for key, label in names.items() if steps.get(key, {}).get('outcome') == 'failure']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('has_partial=' + str(bool(failed)).lower() + '\n')
              stream.write('summary=' + json.dumps(failed, ensure_ascii=False) + '\n')
          PY
  notify-system-failure:
    needs: ["check"]
    if: ${{ always() && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (failure() || cancelled() || needs['check'].outputs.notify_partial == 'true') }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/notify-failure.yml
    with:
      title: "${{ github.workflow }} · ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && '執行失敗／取消' || '部分失敗' }}"
      needs-json: ${{ toJSON(needs) }}
    secrets:
      DISCORD_WEBHOOK_URL1: ${{ secrets.DISCORD_WEBHOOK_URL1 }}
      LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
      LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
