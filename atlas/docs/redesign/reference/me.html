<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Atlas 我的</title>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8A94A3;text-decoration:none}a:hover{color:#EEF1F5}
button,input{font:inherit}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #0E1014; color: #EEF1F5; font-family: 'Noto Sans TC', system-ui, sans-serif; font-size: 14px; line-height: 1.4">

  <header style="padding: 14px 16px 10px">
    <h1 style="margin: 0; font-size: 24px; font-weight: 700; letter-spacing: 0.5px">我的</h1>
  </header>

  <section aria-label="帳號" style="display: flex; flex-direction: column; gap: 12px; margin: 2px 16px 0; padding: 16px; border-radius: 16px; background: #161A20">
    <div style="display: flex; align-items: center; gap: 12px">
      <div style="width: 48px; height: 48px; border-radius: 24px; background: #2A303A; color: #A4ADBA; display: flex; align-items: center; justify-content: center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 12a4 4 0 100-8 4 4 0 000 8zM4.5 20.5c1-3.6 4-5.5 7.5-5.5s6.5 1.9 7.5 5.5"/></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 16px; font-weight: 700">訪客模式</span>
        <span style="font-size: 12px; color: #A4ADBA">操作只暫存到重新整理為止</span>
      </div>
    </div>
    <button type="button" style="height: 48px; border: 0; border-radius: 12px; background: #F5B544; color: #14110A; font-size: 15px; font-weight: 700">使用 LINE 登入</button>
    <label style="display: flex; align-items: center; gap: 10px; min-height: 28px; font-size: 13px; color: #A4ADBA">
      <input type="checkbox" checked style="width: 20px; height: 20px; margin: 0; accent-color: #F5B544">
      記住這台裝置（90 天內免登入）
    </label>
  </section>

  <h2 style="margin: 16px 16px 6px; font-size: 12px; font-weight: 500; color: #8A94A3">個人化</h2>
  <div style="display: flex; flex-direction: column; margin: 0 16px; border-radius: 16px; background: #161A20">
    <a href="watchlist.html" style="display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 16px; border-bottom: 1px solid #1E232B; color: #EEF1F5; font-size: 15px">
      自選清單
      <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #A4ADBA">LINE 熱門 · 5 檔
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span>
    </a>
    <a href="#ma" style="display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 16px; border-bottom: 1px solid #1E232B; color: #EEF1F5; font-size: 15px">
      個股均線參數
      <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #A4ADBA">0 檔
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span>
    </a>
    <a href="#groups" style="display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 16px; color: #EEF1F5; font-size: 15px">
      自訂分組
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A4ADBA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </a>
  </div>

  <h2 style="margin: 16px 16px 6px; font-size: 12px; font-weight: 500; color: #8A94A3">顯示</h2>
  <div style="display: flex; flex-direction: column; margin: 0 16px; border-radius: 16px; background: #161A20">
    <div style="display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 12px 0 16px; border-bottom: 1px solid #1E232B; font-size: 15px">
      漲跌顏色
      <div role="group" aria-label="漲跌顏色" style="display: flex; padding: 2px; border-radius: 10px; background: #0E1014">
        <button type="button" aria-pressed="true" style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 10px; border: 0; border-radius: 8px; background: #2A303A; color: #EEF1F5; font-size: 13px"><span style="color: #FF5A5F">▲</span>紅漲</button>
        <button type="button" aria-pressed="false" style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 10px; border: 0; border-radius: 8px; background: none; color: #A4ADBA; font-size: 13px"><span style="color: #2BC8A8">▲</span>綠漲</button>
      </div>
    </div>
    <a href="#install" style="display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 16px; color: #EEF1F5; font-size: 15px">
      安裝到主畫面
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A4ADBA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </a>
  </div>

  <h2 style="margin: 16px 16px 6px; font-size: 12px; font-weight: 500; color: #8A94A3">資料</h2>
  <div style="display: flex; flex-direction: column; margin: 0 16px; border-radius: 16px; background: #161A20">
    <a href="#status" style="display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 16px; border-bottom: 1px solid #1E232B; color: #EEF1F5; font-size: 15px">
      資料狀態
      <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #A4ADBA">報告日 <span style="font-family: 'IBM Plex Mono', monospace">2026/11/09</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span>
    </a>
    <a href="#backup" style="display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 16px; color: #EEF1F5; font-size: 15px">
      備份與還原
      <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #A4ADBA">登入後可匯出
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span>
    </a>
  </div>

  <nav aria-label="主要分頁" style="position: absolute; left: 0; right: 0; bottom: 0; height: 64px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #12151A; border-top: 1px solid #2A303A">
    <a href="watchlist.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.9 6.8 19.7l1-5.9L3.5 9.7l5.9-.8z"/></svg>自選
    </a>
    <a href="markets.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg>市場
    </a>
    <a href="screener.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>選股
    </a>
    <a href="stock.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3v4M8 15v6M16 3v6M16 17v4M5.5 7h5v8h-5zM13.5 9h5v8h-5z"/></svg>個股
    </a>
    <a href="me.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 700; color: #F5B544">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 12a4 4 0 100-8 4 4 0 000 8zM4.5 20.5c1-3.6 4-5.5 7.5-5.5s6.5 1.9 7.5 5.5"/></svg>我的
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5B544","options":["#F5B544","#5B9DFF","#B7F36B"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#F5B544' };
}
}
</script>
</body>
</html>
